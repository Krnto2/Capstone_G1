# SIREMA · despliegue en el servidor del cuartel (DAS 4.5, Figura 12).
# Cuatro contenedores en la red interna sirema_net; solo el proxy publica puertos.
name: sirema

x-app: &app
  image: sirema-web:0.9.0
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: sirema-db
    DJANGO_STATIC_ROOT: /static
    SIREMA_MEDIA_ROOT: /media
    SIREMA_RESPALDOS_DIR: /respaldos
  networks: [sirema_net]

services:
  sirema-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Santiago
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [sirema_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  sirema-web:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: web
    volumes:
      - media:/media
      - static:/static
    depends_on:
      sirema-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accesos/ingresar/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  sirema-scheduler:
    <<: *app
    command: scheduler
    volumes:
      - media:/media
      - respaldos:/respaldos
    depends_on:
      sirema-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -e /var/run/crond.pid"]
      interval: 60s
      timeout: 5s
      retries: 3

  sirema-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - static:/static:ro
      - media:/media:ro
    depends_on:
      sirema-web:
        condition: service_healthy
    networks: [sirema_net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/accesos/ingresar/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  media:
  static:
  respaldos:

networks:
  sirema_net:
