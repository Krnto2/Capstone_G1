# sirema-proxy: termina HTTPS, sirve los estáticos y entrega las fotos protegidas.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/sirema.crt;
    ssl_certificate_key /etc/nginx/certs/sirema.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # RF-11: fotografías de hasta 10 MB.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /static/;
        expires 7d;
        access_log off;
    }

    # Solo accesible mediante X-Accel-Redirect, después de que Django verifica el permiso.
    location /protegido/ {
        internal;
        alias /media/;
    }

    location / {
        proxy_pass http://sirema-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
